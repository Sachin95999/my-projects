{% extends "base.html" %}
{% block title %}Login — Campus Hub{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card" style="max-width:420px; width:100%;">
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:3rem; margin-bottom:0.5rem;">🎓</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to Campus Hub</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="app-form">
            <div class="form-group">
                <label for="roll_no">Roll Number</label>
                <input type="text" id="roll_no" name="roll_no" required
                       placeholder="E.g. 21BCE1001" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" required
                           placeholder="Enter your password" autocomplete="current-password"
                           style="padding-right:3rem;">
                    <button type="button" id="togglePw"
                            style="position:absolute;right:0.8rem;top:50%;transform:translateY(-50%);
                                   background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-muted);">
                        👁️
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary w-100" style="margin-top:0.5rem;">
                Sign In →
            </button>
        </form>

        <p class="form-footer">
            Don't have an account? <a href="{{ url_for('signup') }}" style="color:var(--primary); font-weight:600;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('togglePw').addEventListener('click', function () {
        const pw = document.getElementById('password');
        const isHidden = pw.type === 'password';
        pw.type = isHidden ? 'text' : 'password';
        this.textContent = isHidden ? '🙈' : '👁️';
    });
</script>
{% endblock %}
