{% extends "base.html" %}
{% block title %}Sign Up — Campus Hub{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card" style="max-width:520px; width:100%;">
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:3rem; margin-bottom:0.5rem;">✨</div>
            <h2>Create an Account</h2>
            <p class="subtitle">Join your campus community</p>
        </div>

        <form method="POST" action="{{ url_for('signup') }}" class="app-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="E.g. Aakash Sharma">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="roll_no">Roll Number</label>
                    <input type="text" id="roll_no" name="roll_no" required placeholder="E.g. 21BCE1001" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="9876543210" maxlength="10">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="hostel_name">Hostel Name <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                    <input type="text" id="hostel_name" name="hostel_name" placeholder="E.g. Block A">
                </div>
                <div class="form-group">
                    <label for="room_no">Room Number <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                    <input type="text" id="room_no" name="room_no" placeholder="E.g. A-101">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" required
                           placeholder="Min. 6 characters" style="padding-right:3rem;" autocomplete="new-password">
                    <button type="button" id="togglePw"
                            style="position:absolute;right:0.8rem;top:50%;transform:translateY(-50%);
                                   background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-muted);">
                        👁️
                    </button>
                </div>
                <!-- Strength bar -->
                <div id="strengthBar" style="height:3px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden;">
                    <div id="strengthFill" style="height:100%;width:0%;border-radius:3px;transition:all 0.3s ease;"></div>
                </div>
                <div id="strengthLabel" style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;"></div>
            </div>

            <div class="form-group">
                <label for="admin_code">Admin Secret Code <span style="color:var(--text-muted);font-weight:400;">(Optional)</span></label>
                <input type="password" id="admin_code" name="admin_code" placeholder="Enter code for admin access">
            </div>

            <button type="submit" class="btn-primary w-100" style="margin-top:0.5rem;">
                Create Account ✨
            </button>
        </form>

        <p class="form-footer">
            Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary); font-weight:600;">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Show/Hide password
    document.getElementById('togglePw').addEventListener('click', function () {
        const pw = document.getElementById('password');
        const isHidden = pw.type === 'password';
        pw.type = isHidden ? 'text' : 'password';
        this.textContent = isHidden ? '🙈' : '👁️';
    });

    // Password strength meter
    const pwInput = document.getElementById('password');
    const fill    = document.getElementById('strengthFill');
    const label   = document.getElementById('strengthLabel');
    const levels  = [
        { max: 0,  color: 'transparent', text: '' },
        { max: 3,  color: '#ef4444',     text: 'Weak' },
        { max: 5,  color: '#f59e0b',     text: 'Fair' },
        { max: 7,  color: '#3b82f6',     text: 'Good' },
        { max: 99, color: '#10b981',     text: 'Strong' },
    ];
    pwInput.addEventListener('input', () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 6)  score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const pct = (score / 5) * 100;
        const lvl = score <= 1 ? levels[1] : (score <= 3 ? levels[2] : (score <= 4 ? levels[3] : levels[4]));
        fill.style.width = pct + '%';
        fill.style.background = lvl.color;
        label.textContent = lvl.text;
        label.style.color = lvl.color;
    });
</script>
{% endblock %}
